# Render 배포 설정 — 이 파일이 있으면 Render가 무엇을 어떻게 실행할지 알아서 읽어요.
services:
  - type: web
    name: sikjangsan-healing
    runtime: node
    plan: free
    region: singapore        # 한국에서 가장 가까운 지역
    buildCommand: npm install --omit=dev   # 데이터베이스 연결용 pg 설치
    # DATABASE_URL(데이터베이스 주소)과 ADMIN_PASSWORD(관리자 비밀번호)는
    # 비밀 정보라서 이 파일에 적지 않고, Render 화면의 Environment에서 직접 넣어요.
    startCommand: node serve.js
    healthCheckPath: /
